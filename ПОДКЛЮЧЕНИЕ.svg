<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730">
<rect width="1200" height="730" fill="#ffffff"/>
<style>.t{font-family:Arial,DejaVu Sans,sans-serif;fill:#1a2732}.small{font-size:16px}.mid{font-size:18px}.lbl{font-size:20px;font-weight:bold}.wire{stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}.pin{fill:#fff;stroke:#334;stroke-width:2}</style>
<text x="48" y="48" class="t" style="font-size:30px;font-weight:bold">3 свича + EC11 → nRF52840 (nice!nano v2)</text>
<text x="48" y="77" class="t small">Схема контактов, не физический вид платы. Питание только от USB. LiPo НЕ подключать.</text>
<rect x="50" y="103" width="360" height="529" rx="19" fill="#e9f0f7" stroke="#447ba6" stroke-width="3"/>
<text x="76" y="136" class="t lbl">nRF52840</text><text x="76" y="160" class="t small">Выводы по маркировке Pro Micro</text>
<line x1="1000" y1="139" x2="1000" y2="585" stroke="#3a4149" stroke-width="7" stroke-linecap="round"/>
<rect x="945" y="103" width="110" height="33" rx="10" fill="#343c43"/><text x="1000" y="126" fill="white" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold">GND</text>
<text x="105" y="202" class="t lbl">D2 / P0.17</text><circle class="pin" cx="390" cy="195" r="7"/><path d="M397 195 H600" class="wire" stroke="#4a8aca"/><text x="615" y="183" class="t mid">Свич 1 → A</text><rect x="604" y="191" width="246" height="28" rx="7" fill="#fff" stroke="#4a8aca" stroke-width="2"/><path d="M850 205 H1000" class="wire" stroke="#3a4149"/><text x="105" y="272" class="t lbl">D3 / P0.20</text><circle class="pin" cx="390" cy="265" r="7"/><path d="M397 265 H600" class="wire" stroke="#498da6"/><text x="615" y="253" class="t mid">Свич 2 → B</text><rect x="604" y="261" width="246" height="28" rx="7" fill="#fff" stroke="#498da6" stroke-width="2"/><path d="M850 275 H1000" class="wire" stroke="#3a4149"/><text x="105" y="342" class="t lbl">D4 / P0.22</text><circle class="pin" cx="390" cy="335" r="7"/><path d="M397 335 H600" class="wire" stroke="#3a9a86"/><text x="615" y="323" class="t mid">Свич 3 → C</text><rect x="604" y="331" width="246" height="28" rx="7" fill="#fff" stroke="#3a9a86" stroke-width="2"/><path d="M850 345 H1000" class="wire" stroke="#3a4149"/><text x="105" y="412" class="t lbl">D5 / P0.24</text><circle class="pin" cx="390" cy="405" r="7"/><path d="M397 405 H600" class="wire" stroke="#997bc2"/><text x="615" y="393" class="t mid">EC11: нажатие</text><rect x="604" y="401" width="246" height="28" rx="7" fill="#fff" stroke="#997bc2" stroke-width="2"/><path d="M850 415 H1000" class="wire" stroke="#3a4149"/><text x="105" y="492" class="t lbl">D6 / P1.00</text><circle class="pin" cx="390" cy="485" r="7"/><path d="M397 485 H600" class="wire" stroke="#d07c37"/><text x="615" y="473" class="t mid">EC11: A (вращение)</text><circle cx="850" cy="485" r="9" fill="white" stroke="#d07c37" stroke-width="3"/><path d="M600 485 H841" class="wire" stroke="#d07c37"/><text x="105" y="572" class="t lbl">D7 / P0.11</text><circle class="pin" cx="390" cy="565" r="7"/><path d="M397 565 H600" class="wire" stroke="#cf5967"/><text x="615" y="553" class="t mid">EC11: B (вращение)</text><circle cx="850" cy="565" r="9" fill="white" stroke="#cf5967" stroke-width="3"/><path d="M600 565 H841" class="wire" stroke="#cf5967"/><path d="M850 519 H930 V535 H1000" class="wire" stroke="#3a4149"/>
<rect x="795" y="460" width="125" height="129" rx="13" fill="none" stroke="#555" stroke-dasharray="7 6" stroke-width="2"/>
<text x="829" y="449" class="t small">3 контакта</text>
<text x="853" y="519" class="t small">C</text>
<rect x="51" y="655" width="1110" height="48" rx="10" fill="#fff4dd" stroke="#dfaf42"/>
<text x="66" y="685" class="t mid">EC11: у тройки выводов средний C → GND; у пары выводов один → D5, другой → GND.</text>
